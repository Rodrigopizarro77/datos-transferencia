```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Datos para transferencia</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .contenedor {
            width: 100%;
            max-width: 420px;

            background: white;
            padding: 30px 24px;
            border-radius: 18px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .icono {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin: 0 0 30px 0;
        }

        .dato {
            margin-bottom: 22px;
        }

        .etiqueta {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }

        .campo {
            display: flex;
            align-items: center;

            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 10px;

            padding: 12px;
        }

        .valor {
            flex: 1;
            font-size: 16px;
            word-break: break-all;
        }

        .boton {
            border: none;
            background: white;
            cursor: pointer;

            font-size: 20px;
            padding: 5px 7px;
            margin-left: 8px;

            border-radius: 7px;
        }

        .boton:active {
            transform: scale(0.95);
        }

        .mensaje {
            text-align: center;
            height: 20px;

            font-size: 14px;
            font-weight: bold;
            color: #16803c;

            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="icono">🏦</div>

        <h1>Datos para transferencia</h1>

        <div class="dato">
            <span class="etiqueta">Alias</span>

            <div class="campo">
                <span class="valor" id="alias">MI.ALIAS.BANCO</span>

                <button class="boton" onclick="copiar('alias', 'Alias copiado ✓')" aria-label="Copiar Alias">
                    📋
                </button>
            </div>
        </div>

        <div class="dato">
            <span class="etiqueta">CBU</span>

            <div class="campo">
                <span class="valor" id="cbu">0720123456789012345678</span>

                <button class="boton" onclick="copiar('cbu', 'CBU copiado ✓')" aria-label="Copiar CBU">
                    📋
                </button>
            </div>
        </div>

        <div class="mensaje" id="mensaje"></div>

    </div>

    <script>
        function copiar(id, texto) {

            const elemento = document.getElementById(id);
            const contenido = elemento.innerText;

            navigator.clipboard.writeText(contenido)
                .then(function() {

                    const mensaje = document.getElementById("mensaje");

                    mensaje.innerText = texto;

                    setTimeout(function() {
                        mensaje.innerText = "";
                    }, 2000);

                })
                .catch(function() {

                    alert("No se pudo copiar automáticamente. Mantené presionado el dato para copiarlo.");

                });
        }
    </script>

</body>
</html>
```
